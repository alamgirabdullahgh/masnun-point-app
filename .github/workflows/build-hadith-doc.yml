name: Build Hadith Data From Google Doc

# input/hadith-doc/doc.txt (fetch-hadith-doc workflow-এর নামানো Google Doc) থেকে data/hadith-chunks বানায়
# (tools/build-hadith-doc.js), কমিট করে, তারপর নতুন APK বিল্ড চালু করে।
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Build data/hadith-chunks
        run: node tools/build-hadith-doc.js input/hadith-doc/doc.txt data/hadith-chunks
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/hadith-chunks
          git commit -m "হাদীস ডেটা: Google Doc থেকে বানানো" || echo "No changes"
          git push
      - name: Trigger APK build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
