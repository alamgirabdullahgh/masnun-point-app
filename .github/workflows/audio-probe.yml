name: Audio probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg parallel
      - name: Download all verses (Alafasy 128kbps, everyayah)
        run: |
          mkdir -p src && python3 - <<'PY' > list.txt
          a=[int(x) for x in open('tools/audio/ayn.txt').read().split(',')]
          for s,c in enumerate(a,1):
              for v in range(1,c+1): print('%03d%03d'%(s,v))
          PY
          wc -l list.txt
          cat list.txt | parallel -j8 'f=src/{}.mp3; for i in 1 2 3; do curl -sf --max-time 60 -o $f https://everyayah.com/data/Alafasy_128kbps/{}.mp3 && break; sleep 2; done'
          ls src | wc -l; du -sh src
      - name: Probe format and duration
        run: |
          ffprobe -v error -show_entries stream=codec_name,channels,sample_rate,bit_rate -of default=nw=1 src/001001.mp3
          ffprobe -v error -show_entries stream=channels,sample_rate,bit_rate -of csv=p=0 src/002255.mp3
          python3 - <<'PY'
          import subprocess,glob
          tot=0;n=0;ch={}
          for f in sorted(glob.glob('src/*.mp3')):
              o=subprocess.run(['ffprobe','-v','error','-show_entries','format=duration:stream=channels','-of','csv=p=0',f],capture_output=True,text=True).stdout.split()
              try:
                  tot+=float(o[-1]); n+=1
              except: pass
              ch[o[0]]=ch.get(o[0],0)+1 if o else 0
          print('files',n,'hours',round(tot/3600,2),'channels',ch)
          PY
      - name: Stereo difference check (is it really mono?)
        run: |
          for f in 001001 002255 018010 036001 112001; do
            ffmpeg -v error -i src/$f.mp3 -af "pan=mono|c0=c0-c1,volumedetect" -f null - 2>&1 | grep mean_volume | sed "s/^/$f side: /"
            ffmpeg -v error -i src/$f.mp3 -af "pan=mono|c0=0.5*c0+0.5*c1,volumedetect" -f null - 2>&1 | grep mean_volume | sed "s/^/$f mid : /"
          done
      - name: Candidate sizes (all verses)
        run: |
          mkdir -p c1 c2 c3
          enc(){ ffmpeg -v error -y -i src/$1.mp3 $2 $3; }
          export -f enc
          cat list.txt | parallel -j4 'ffmpeg -v error -y -i src/{}.mp3 -ac 1 -c:a libmp3lame -b:a 64k c1/{}.mp3'
          cat list.txt | parallel -j4 'ffmpeg -v error -y -i src/{}.mp3 -ac 1 -c:a libmp3lame -q:a 3 c2/{}.mp3'
          cat list.txt | parallel -j4 'ffmpeg -v error -y -i src/{}.mp3 -ac 1 -c:a libmp3lame -b:a 48k c3/{}.mp3'
          for d in src c1 c2 c3; do echo "$d $(du -sm $d | cut -f1) MB"; done
