name: Fetch Symptom Diagnosis Page

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download raw HTML source
        run: |
          mkdir -p symptom-diagnosis
          curl -sL "https://dailyruqyah.blogspot.com/p/symptom-diagnosis.html" -o symptom-diagnosis/source.html

      - name: Render page in headless browser
        run: |
          npm init -y >/dev/null
          npm install playwright >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          cat > render.js << 'JS'
          const { chromium } = require('playwright');
          const fs = require('fs');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            await page.goto('https://dailyruqyah.blogspot.com/p/symptom-diagnosis.html', { waitUntil: 'networkidle' });
            await page.waitForTimeout(5000);
            fs.writeFileSync('symptom-diagnosis/rendered.html', await page.content());
            fs.writeFileSync('symptom-diagnosis/rendered-text.txt', await page.evaluate(() => document.body.innerText));
            await page.screenshot({ path: 'symptom-diagnosis/screenshot.png', fullPage: true });
            await browser.close();
          })();
          JS
          node render.js
          rm -rf render.js package.json package-lock.json node_modules

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add symptom-diagnosis
          git commit -m "Save Symptom Diagnosis page (source + rendered)" || echo "No changes"
          git push
