name: Upload Blogger theme to release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload blogger-theme-1 blogger-theme/theme-new.xml --clobber
