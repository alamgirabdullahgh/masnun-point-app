name: Fetch Hadith Google Doc

# Google Doc (লিংক-শেয়ার করা) নামিয়ে input/hadith-doc/-এ রাখে: txt, html ও docx
on:
  workflow_dispatch:
    inputs:
      doc_id:
        description: "Google Doc ID"
        default: "1AVCVZrVmrm8WH8vPo_BcxOV7iAbJm4QUbpdcsEQTxJM"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download doc
        run: |
          D=input/hadith-doc; mkdir -p $D
          for f in txt html docx; do
            curl -sSL -o "$D/doc.$f" -w "$f -> HTTP %{http_code}, %{size_download} bytes, %{content_type}\n" \
              "https://docs.google.com/document/d/${{ github.event.inputs.doc_id }}/export?format=$f"
          done
          ls -la $D; head -c 600 $D/doc.txt || true
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add input/hadith-doc
          git commit -m "হাদীস Google Doc নামানো (কাঁচা ফাইল)" || echo "No changes"
          git push
